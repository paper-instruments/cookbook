[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fireworks-training-cookbook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fireworks-ai[training] @ git+https://github.com/paper-instruments/python-sdk.git@972da366e7a3071fb851acd6079c4b8e5902feca",
    "tinker-cookbook==0.4.3",
    "tqdm",
    "torch",
    "datasets",
    "tiktoken",
    "numpy",
    "transformers==5.5.4",
    "python-dotenv",
    "wandb",
    "orjson",
    "hydra-core>=1.3,<2",
]

[project.optional-dependencies]
eval = [
    "eval-protocol>=0.3.32",
    "pillow",
]
dev = [
    "fireworks-training-cookbook[eval]",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "math-verify",
]
[tool.setuptools.packages.find]
where = [".."]
include = ["training*"]

[tool.setuptools.package-data]
"training.provision" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["training/tests"]
markers = [
    "e2e: tests that hit remote Fireworks infrastructure",
    "timeout: per-test timeout budget",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]

[tool.coverage.report]
show_missing = true
skip_covered = true
include = [
    "recipes/*.py",
    "examples/*/train_*.py",
    "examples/*/prepare_data.py",
]
omit = [
    "*/__init__.py",
]
